name: ci

on:
  push:
    branches: [master, beta]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core tests, coverage gate, script self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # :core is pure Kotlin/JVM, so its tests need no emulator. The coverage gate fails the build
      # below 95% line coverage and prints the measured number.
      - name: ":core tests and coverage gate"
        run: ./gradlew :core:test :core:coverageGate

      - name: Mock endpoint self-test
        run: python3 scripts/mock-openai.py --selftest

      - name: Bundled userland checks (hashes, ELF shape, rm shim)
        run: bash scripts/test-userland.sh

  apk:
    name: debug APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
